<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pickabook</title>

<!-- Google Fonts: Fraunces (the italic serif) + Poppins (the bold sans) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,500&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

<!-- All visual styling lives here -->
<link rel="stylesheet" href="styles.css">
</head>
<body>

<button id="menuToggle" type="button" aria-label="Open menu" title="Menu" aria-expanded="false" aria-controls="menuDrawer">
  <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">
    <rect x="2" y="5" width="3.5" height="12" rx="0.8" style="fill:var(--s0)"/>
    <rect x="6.5" y="3" width="3.5" height="14" rx="0.8" style="fill:var(--s1)"/>
    <rect x="11" y="6" width="3.5" height="11" rx="0.8" style="fill:var(--s3)"/>
    <rect x="15.5" y="4" width="3.5" height="13" rx="0.8" style="fill:var(--s4)"/>
    <rect x="1" y="17.5" width="20" height="1.8" rx="0.9" style="fill:var(--plank)"/>
  </svg>
</button>

<button id="themeToggle" type="button" aria-label="Switch to light mode" title="Switch to light mode">🌙</button>

<div id="menuScrim" class="menu-scrim"></div>
<aside id="menuDrawer" class="menu-drawer" role="dialog" aria-label="Menu">
  <div class="drawer-head">
    <button id="drawerBack" type="button" aria-label="Back to menu" hidden>
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
    </button>
    <h2 id="drawerTitle">Menu</h2>
    <button id="menuClose" type="button" aria-label="Close menu">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
    </button>
  </div>

  <!-- VIEW 1: the list of menu options. Add a new <li> here for each new option. -->
  <div id="menuView">
    <ul class="menu-list">
      <li><button type="button" class="menu-item" data-view="shelf"><span>My shelf</span><span aria-hidden="true">›</span></button></li>
    </ul>
  </div>

  <!-- VIEW 2: the shelf -->
  <div id="shelfView" hidden>
    <p class="shelf-hint">Newest spin on the left. Each row keeps your last 6.</p>
    <div id="shelfRows"></div>
    <div id="shelfDetail" class="shelf-detail" aria-live="polite"></div>
    <button id="shelfClear" type="button" class="shelf-clear">Clear shelf</button>
  </div>
</aside>

<div class="card">
  <h1>pickabook</h1>
  <p class="subtitle">spin to pick your next read</p>

  <div class="genre-bar">
    <label for="genreSelect">Genre</label>
    <select id="genreSelect">
      <option value="all">All genres</option>
    </select>
  </div>

  <div class="reel-frame">
    <div class="reel-window"></div>
    <div id="reel"></div>
  </div>

  <div class="spin-row">
    <button id="spinBtn">Spin for a book</button>
    <button id="muteBtn" type="button" aria-label="Mute sound" title="Mute sound">🔊</button>
  </div>

  <div id="resultBox">
    <button id="readBtn">Read this book →</button>
  </div>

  <p class="footnote" id="footnote"></p>
</div>

<!-- All the interactive logic (fetching books, spinning, filtering) lives here -->
<script src="script.js"></script>

</body>
</html>
